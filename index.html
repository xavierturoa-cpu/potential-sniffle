<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stunt Playground</title><style>html,body{margin:0;overflow:hidden;background:#151515}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:10px;left:10px;color:#fff;font:14px monospace;line-height:1.5;pointer-events:none}</style></head><body><canvas id="c"></canvas><div id="hud">W/S throttle + brake · A/D steer · SPACE handbrake · R reset<br>Open playground · ramps · jumps · free driving · <span id="s">0</span> km/h</div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),S=document.getElementById('s');let W,H;function size(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=size;size();const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')reset()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
let car,camX=0,camY=0;const ramps=[{x:520,y:510,w:170,h:130},{x:980,y:510,w:220,h:210},{x:1530,y:510,w:150,h:260},{x:2050,y:510,w:260,h:150},{x:2700,y:510,w:180,h:320},{x:3300,y:510,w:300,h:180}];const walls=[{x:790,y:410,w:90,h:100},{x:1280,y:350,w:100,h:160},{x:1840,y:420,w:120,h:90},{x:2450,y:330,w:130,h:180},{x:3050,y:390,w:140,h:120}];
function reset(){car={x:250,y:460,vx:0,vy:0,a:0,va:0,grounded:true};camX=0;camY=0}reset();
function rampSurface(px){for(const r of ramps){if(px>=r.x&&px<=r.x+r.w){let t=(px-r.x)/r.w;return r.y-r.h*t}}return 510}
function physics(dt){const throttle=keys.w||keys.arrowup,brake=keys.s||keys.arrowdown,steer=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),hand=keys[' '];let drive=car.grounded?42:7;if(throttle)car.vx+=drive*dt;if(brake)car.vx-=car.grounded?55*dt:8*dt;if(hand)car.vx*=Math.pow(.08,dt);else car.vx*=Math.pow(.45,dt);car.vx=Math.max(-22,Math.min(90,car.vx));
let gy=rampSurface(car.x);if(car.grounded){car.a+=((Math.atan2((rampSurface(car.x+3)-rampSurface(car.x-3))/6,1))-car.a)*Math.min(1,14*dt);car.vy=0;car.y=gy-28;car.va+=(steer*.13-car.va*9)*dt;car.a+=car.va*dt;if(steer&&Math.abs(car.vx)>2)car.vx+=steer*Math.abs(car.vx)*.35*dt}else{car.vy+=30*dt;car.y+=car.vy*dt;car.a+=steer*5*dt;car.va*=.99}car.x+=car.vx*dt;
if(car.y>=gy-28&&car.vy>=0){car.y=gy-28;car.vy=0;car.grounded=true}else car.grounded=false;if(car.y>1100)reset();camX+=(car.x-camX-W*.38)*Math.min(1,7*dt);camY+=(car.y-camY-H*.55)*Math.min(1,5*dt)}
function draw(){g.fillStyle='#151515';g.fillRect(0,0,W,H);g.save();g.translate(-camX,-camY);g.fillStyle='#303030';g.fillRect(-1000,510,6000,1000);g.fillStyle='#444';g.fillRect(-1000,500,6000,25);
for(const r of ramps){g.fillStyle='#777';g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x+r.w,r.y);g.lineTo(r.x+r.w,r.y+ r.h);g.closePath();g.fill();g.fillStyle='#aaa';g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x+r.w,r.y);g.lineTo(r.x+r.w,r.y+8);g.lineTo(r.x+8,r.y+8);g.closePath();g.fill()}
for(const b of walls){g.fillStyle='#666';g.fillRect(b.x,b.y,b.w,b.h)}g.save();g.translate(car.x,car.y);g.rotate(car.a);g.fillStyle='#d22';g.fillRect(-42,-18,84,28);g.fillStyle='#111';g.fillRect(-29,10,20,12);g.fillRect(12,10,20,12);g.fillStyle='#8cf';g.fillRect(-15,-15,30,12);g.restore();g.restore();S.textContent=Math.round(Math.abs(car.vx)*3.6)}let last=performance.now();function loop(t){let dt=Math.min(.025,(t-last)/1000);last=t;physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
