<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stunt Drive</title><style>html,body{margin:0;overflow:hidden;background:#111}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:10px;left:10px;color:#fff;font:14px monospace;user-select:none}</style></head><body><canvas id="c"></canvas><div id="hud">W/S throttle/brake · A/D steer · R reset<br>speed <span id="s">0</span> km/h</div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),S=document.getElementById('s');let W,H;function size(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=size;size();
const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')reset()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
let car,cam=0;const track=[{x:0,y:0,w:600,h:0},{x:600,y:0,w:240,h:-90},{x:840,y:-90,w:350,h:90},{x:1190,y:0,w:180,h:-150},{x:1370,y:-150,w:400,h:150},{x:1770,y:0,w:260,h:-110},{x:2030,y:-110,w:500,h:110},{x:2530,y:0,w:300,h:-190},{x:2830,y:-190,w:650,h:190},{x:3480,y:0,w:600,h:0}];
function ground(x){for(const p of track)if(x>=p.x&&x<=p.x+p.w){let t=(x-p.x)/p.w;return 520+p.h*t}return 700}
function reset(){car={x:180,y:470,vx:0,vy:0,a:0,va:0,grounded:true,wheelBase:62};cam=0}reset();
function physics(dt){const throttle=keys.w||keys.arrowup,brake=keys.s||keys.arrowdown,steer=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);let sp=Math.hypot(car.vx,car.vy);
 if(throttle)car.vx+=12*dt; if(brake)car.vx-=car.grounded?20*dt:3*dt; car.vx*=Math.pow(.18,dt);car.vx=Math.max(-18,Math.min(30,car.vx));
 const gy=ground(car.x),slope=(ground(car.x+2)-ground(car.x-2))/4;const target=Math.atan2(slope,1);if(car.grounded){car.a+=(target-car.a)*Math.min(1,10*dt);car.vy=0;car.y=gy-28;const steerForce=steer*0.045*(Math.abs(car.vx)+2);car.va+=(steerForce-car.va*7)*dt;car.a+=car.va*dt}else{car.vy+=24*dt;car.y+=car.vy*dt;car.a+=steer*3.2*dt;car.va*=.995}
 car.x+=car.vx*dt;if(car.y>=gy-28&&car.vy>=0){car.y=gy-28;car.vy=0;car.grounded=true}else car.grounded=false;
 if(car.x<20)car.x=20;if(car.y>900)reset();cam+=(car.x-cam-W*.35)*Math.min(1,5*dt)}
function draw(){g.fillStyle='#111';g.fillRect(0,0,W,H);g.save();g.translate(-cam,0);g.strokeStyle='#eee';g.lineWidth=70;g.lineCap='butt';g.beginPath();for(let x=0;x<4100;x+=4){let y=ground(x);if(x===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();g.strokeStyle='#444';g.lineWidth=54;g.beginPath();for(let x=0;x<4100;x+=4){let y=ground(x);if(x===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();
 g.save();g.translate(car.x,car.y);g.rotate(car.a);g.fillStyle='#d22';g.fillRect(-38,-18,76,28);g.fillStyle='#222';g.fillRect(-25,10,18,10);g.fillRect(12,10,18,10);g.fillStyle='#8cf';g.fillRect(-14,-15,27,12);g.restore();g.restore();S.textContent=Math.round(Math.abs(car.vx)*3.6)}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
