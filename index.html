<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Stunt Playground</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial}canvas{display:block}#hud{position:fixed;top:12px;left:12px;color:#fff;background:#0009;padding:10px 12px;border-radius:8px;font:14px monospace;pointer-events:none}</style></head>
<body><div id="hud">W/S throttle/brake · A/D steer · SPACE handbrake · R reset<br>Speed: <b id="speed">0</b> km/h</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x15191d);scene.fog=new THREE.Fog(0x15191d,100,500);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(80,120,50);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.BoxGeometry(520,2,260),new THREE.MeshStandardMaterial({color:0x383838,roughness:.95}));ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);
const rampMat=new THREE.MeshStandardMaterial({color:0x555b61,roughness:.8}),ramps=[];
function addRamp(x,z,w,h,len){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.8,len),rampMat);m.position.set(x,h/2,z);m.rotation.x=-Math.atan2(h,len);m.castShadow=m.receiveShadow=true;scene.add(m);ramps.push({x,z,w,h,len});}
[[0,-35,10,5,22],[35,-10,12,9,28],[-35,20,14,12,32],[55,40,16,16,38],[-55,65,12,7,24],[20,90,18,20,45],[75,105,14,11,30],[-70,-70,18,14,34]].forEach(p=>addRamp(...p));
const obstacleMat=new THREE.MeshStandardMaterial({color:0x666b70});
for(const p of [[-15,-5,4,3,8],[18,12,5,4,5],[-48,-25,6,5,6],[48,-55,5,3,10],[65,15,4,6,4],[-5,55,7,4,4]]){const m=new THREE.Mesh(new THREE.BoxGeometry(p[2],p[3],p[4]),obstacleMat);m.position.set(p[0],p[3]/2,p[1]);m.castShadow=m.receiveShadow=true;scene.add(m);}
function makeCar(){const q=new THREE.Group(),bodyMat=new THREE.MeshStandardMaterial({color:0xd52222,metalness:.35,roughness:.3}),dark=new THREE.MeshStandardMaterial({color:0x151515,roughness:.5}),glass=new THREE.MeshStandardMaterial({color:0x79a9b8,metalness:.2,roughness:.15});const body=new THREE.Mesh(new THREE.BoxGeometry(2.05,.55,4.2),bodyMat);body.position.y=.75;q.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.65,1.9),glass);cabin.position.set(0,1.25,.15);q.add(cabin);const wheels=[];for(const x of [-1.02,1.02])for(const z of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,20),dark);w.rotation.z=Math.PI/2;w.position.set(x,.42,z);q.add(w);wheels.push(w);}q.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(q);return{group:q,wheels};}
const visual=makeCar(),keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const car={pos:new THREE.Vector3(0,1,35),vel:new THREE.Vector3(),yaw:Math.PI,steer:0,pitch:0,roll:0,grounded:true};const maxSpeed=65;
function reset(){car.pos.set(0,1,35);car.vel.set(0,0,0);car.yaw=Math.PI;car.steer=0;car.pitch=0;car.roll=0;car.grounded=true}
function heightAt(x,z){let best=0;for(const r of ramps){if(Math.abs(x-r.x)<=r.w/2&&Math.abs(z-r.z)<=r.len/2){const t=(z+r.len/2)/r.len;best=Math.max(best,r.h*(1-t));}}return best}
function physics(dt){const throttle=keys.KeyW||keys.ArrowUp,braking=keys.KeyS||keys.ArrowDown,left=keys.KeyA||keys.ArrowLeft,right=keys.KeyD||keys.ArrowRight,hand=keys.Space;const f=new THREE.Vector3(Math.sin(car.yaw),0,Math.cos(car.yaw)),speed=car.vel.length(),input=(right?1:0)-(left?1:0);car.steer+=(input*.55-car.steer)*Math.min(1,8*dt);
if(car.grounded){if(throttle)car.vel.addScaledVector(f,38*dt);if(braking)car.vel.addScaledVector(f,-55*dt);const side=new THREE.Vector3(Math.cos(car.yaw),0,-Math.sin(car.yaw)),sideVel=car.vel.dot(side);car.vel.addScaledVector(side,-sideVel*(hand?.35:.82)*dt*8);car.yaw+=car.steer*Math.min(speed/7,1)*1.9*dt*(hand?1.5:1);car.vel.multiplyScalar(Math.pow(hand?.82:.94,dt));if(car.vel.length()>maxSpeed)car.vel.setLength(maxSpeed);}else{car.vel.y-=26*dt;car.yaw+=car.steer*.8*dt;}
car.pos.addScaledVector(car.vel,dt);const terrain=heightAt(car.pos.x,car.pos.z);if(car.pos.y<=terrain+.55&&car.vel.y<=0){car.pos.y=terrain+.55;car.vel.y=0;car.grounded=true;}else car.grounded=false;if(car.pos.y<-30)reset();
visual.group.position.copy(car.pos);visual.group.rotation.set(car.pitch,car.yaw,car.roll);for(const w of visual.wheels)w.rotation.x+=car.vel.length()*dt*2.4;visual.wheels[0].rotation.y=visual.wheels[1].rotation.y=car.steer*.35;document.getElementById('speed').textContent=Math.round(car.vel.length()*3.6);}
const clock=new THREE.Clock();function loop(){const dt=Math.min(clock.getDelta(),.033);physics(dt);const f=new THREE.Vector3(Math.sin(car.yaw),0,Math.cos(car.yaw)),desired=car.pos.clone().addScaledVector(f,-9).add(new THREE.Vector3(0,4.2,0));camera.position.lerp(desired,1-Math.pow(.0001,dt));camera.lookAt(car.pos.clone().add(new THREE.Vector3(0,.8,0)).addScaledVector(f,5));renderer.render(scene,camera);requestAnimationFrame(loop);}reset();loop();
</script></body></html>
