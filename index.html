<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Highway</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#91a7b5;font-family:Arial}canvas{display:block}#hud{position:fixed;top:14px;left:14px;color:#fff;background:#0008;padding:10px 14px;border-radius:9px;font:14px monospace;z-index:5;line-height:1.5}#speed{font-size:24px;font-weight:bold}#error{display:none;position:fixed;inset:0;background:#222;color:#fff;padding:40px;font:18px monospace;z-index:20}</style></head>
<body><div id="hud"><div id="speed">0 km/h</div><div id="distance">0 m</div><div id="status">DRIVING</div><br>A/D or ←/→ steer · W/↑ accelerate<br>S/↓ brake · R restart</div><div id="error"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{if(!window.THREE){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Could not load the 3D engine.';return}
const T=THREE,S=new T.Scene();S.background=new T.Color(0x91a7b5);S.fog=new T.Fog(0x91a7b5,90,430);
const C=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,900),R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
S.add(new T.HemisphereLight(0xe8f0f2,0x526052,1.35));let sun=new T.DirectionalLight(0xffffff,1.5);sun.position.set(-80,120,40);sun.castShadow=true;S.add(sun);
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.88}),roadMat=mat(0x343738),grassMat=mat(0x667d59),lineMat=mat(0xe4e1ce),barrierMat=mat(0x777b7b);
const ground=new T.Mesh(new T.PlaneGeometry(2000,2000),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;S.add(ground);
const road=new T.Mesh(new T.PlaneGeometry(18,500),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-170;road.receiveShadow=true;S.add(road);
const shoulderL=new T.Mesh(new T.PlaneGeometry(1.2,500),barrierMat),shoulderR=shoulderL.clone();shoulderL.rotation.x=shoulderR.rotation.x=-Math.PI/2;shoulderL.position.set(-9.5,0,-170);shoulderR.position.set(9.5,0,-170);S.add(shoulderL,shoulderR);
const laneLines=[];for(let z=-420;z<90;z+=12)for(const x of[-3,3]){let m=new T.Mesh(new T.BoxGeometry(.12,.025,6),lineMat);m.position.set(x,.015,z);S.add(m);laneLines.push(m)}
const posts=[];for(let z=-420;z<100;z+=18)for(const x of[-11,11]){let p=new T.Mesh(new T.BoxGeometry(.18,1.2,.18),barrierMat);p.position.set(x,.6,z);S.add(p);posts.push(p)}
function carMesh(color){let g=new T.Group(),b=new T.Mesh(new T.BoxGeometry(2.15,.55,4.1),mat(color)),cab=new T.Mesh(new T.BoxGeometry(1.55,.68,1.75),new T.MeshStandardMaterial({color:0x9bb4bd,roughness:.25}));b.position.y=.65;cab.position.set(0,1.05,.15);g.add(b,cab);for(const x of[-1.08,1.08])for(const z of[-1.4,1.4]){let w=new T.Mesh(new T.CylinderGeometry(.38,.38,.28,14),mat(0x17191a));w.rotation.z=Math.PI/2;w.position.set(x,.38,z);g.add(w)}g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}
const player=carMesh(0xc63e3e);S.add(player);let traffic=[];
const colors=[0xd1d1d1,0x4e76ad,0xd29d37,0x5e8068,0x8c5c68,0x222426];
function spawn(){let lane=Math.floor(Math.random()*3)-1,g=carMesh(colors[Math.floor(Math.random()*colors.length)]);g.position.set(lane*3,0,-190-Math.random()*230);g.scale.setScalar(.9);S.add(g);traffic.push({g,lane,speed:38+Math.random()*32})}
let keys={},speed=0,distance=0,dead=false,spawnT=0,lateral=0,best=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reset();});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
function reset(){traffic.forEach(o=>S.remove(o.g));traffic=[];speed=0;distance=0;lateral=0;dead=false;spawnT=.5;player.position.set(0,0,4);player.rotation.set(0,0,0)}
function update(dt){if(dead)return;
let steer=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);lateral+=steer*dt*7;lateral*=Math.pow(.78,dt*60);lateral=Math.max(-7.2,Math.min(7.2,lateral));
if(keys.KeyW||keys.ArrowUp)speed+=48*dt;else speed-=8*dt;if(keys.KeyS||keys.ArrowDown)speed-=70*dt;speed=Math.max(0,Math.min(145,speed));distance+=speed*dt/3.6;
player.position.x=lateral;player.rotation.z=-steer*.08;player.rotation.y=steer*.06;
for(const m of laneLines)m.position.z+=speed*dt;if(laneLines[0].position.z>20)laneLines.forEach(m=>m.position.z-=432);
for(const p of posts)p.position.z+=speed*dt;if(posts[0].position.z>25)posts.forEach(p=>p.position.z-=432);
spawnT-=dt;if(spawnT<=0&&speed>20){spawn();spawnT=.65+Math.random()*1.15}
for(let i=traffic.length-1;i>=0;i--){let o=traffic[i];o.g.position.z+=((speed-o.speed)*.22+speed)*dt;if(o.g.position.z>30){S.remove(o.g);traffic.splice(i,1);continue}if(Math.abs(o.g.position.x-player.position.x)<1.65&&Math.abs(o.g.position.z-player.position.z)<3.1){dead=true;best=Math.max(best,Math.floor(distance))}}
document.getElementById('speed').textContent=Math.round(speed)+' km/h';document.getElementById('distance').textContent=Math.floor(distance)+' m';document.getElementById('status').textContent=dead?'CRASH — press R':'BEST '+best+' m'}
reset();let clock=new T.Clock();
function loop(){let dt=Math.min(clock.getDelta(),.033);update(dt);let target=new T.Vector3(player.position.x*.72,4.3,player.position.z+9);C.position.lerp(target,1-Math.pow(.0002,dt));C.lookAt(new T.Vector3(player.position.x,0.8,player.position.z-8));R.render(S,C);requestAnimationFrame(loop)}loop();
})();</script></body></html>
