<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poly Track Racer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#79b9df;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 4px #0009;pointer-events:none}
#time{font:bold 34px monospace;letter-spacing:2px}
#stats{font:15px monospace;margin-top:3px}
#help{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);color:#fff;background:#0007;padding:7px 12px;border-radius:5px;font:13px monospace;pointer-events:none}
#msg{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);color:white;font:bold 42px Arial;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="hud"><div id="time">00:00.000</div><div id="stats">0 km/h · CHECKPOINT 1/8</div></div>
<div id="msg">GO!</div>
<div id="help">W / ↑ accelerate · S / ↓ brake · A D / ← → steer · SPACE drift · R restart</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x79b9df);
scene.fog=new THREE.Fog(0x79b9df,180,600);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff4ff,0x6e7f58,2.4));
const sun=new THREE.DirectionalLight(0xffffff,3.5);
sun.position.set(-80,150,100);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const matRoad=new THREE.MeshStandardMaterial({color:0x555b61,roughness:1});
const matEdge=new THREE.MeshStandardMaterial({color:0xe7e7e7,roughness:.8});
const matGrass=new THREE.MeshStandardMaterial({color:0x719b55,roughness:1});
const matDark=new THREE.MeshStandardMaterial({color:0x30343a,roughness:1});
const matAccent=new THREE.MeshStandardMaterial({color:0xe45a4f,roughness:.8});

// Low-poly terrain.
const terrain=new THREE.Mesh(new THREE.PlaneGeometry(900,900,20,20),matGrass);
terrain.rotation.x=-Math.PI/2;
terrain.receiveShadow=true;
scene.add(terrain);

// ----- TRACK PATH -----
const control=[
 [0,0,110],[55,3,104],[94,10,62],[88,6,12],[60,1,-34],
 [5,5,-56],[-52,13,-42],[-91,7,5],[-78,3,58],[-35,0,91]
].map(p=>new THREE.Vector3(...p));
const curve=new THREE.CatmullRomCurve3(control,true,'catmullrom',.5);
const N=360,WIDTH=11;
const center=[],tan=[],normal=[];
for(let i=0;i<N;i++){
 const t=i/N,p=curve.getPointAt(t),d=curve.getTangentAt(t).normalize();
 center.push(p);tan.push(d);normal.push(new THREE.Vector3(-d.z,0,d.x).normalize());
}

// Elevation is intentionally designed into the track.
function roadHeight(t){
 const a=curve.getPointAt(t);
 return a.y + 2.0*Math.sin(t*Math.PI*2*2.5) + 1.2*Math.sin(t*Math.PI*2*5);
}
for(let i=0;i<N;i++)center[i].y=roadHeight(i/N);

// Recalculate tangents/normals after elevation.
for(let i=0;i<N;i++){
 const prev=center[(i-1+N)%N],next=center[(i+1)%N];
 tan[i]=next.clone().sub(prev).normalize();
 normal[i]=new THREE.Vector3(-tan[i].z,0,tan[i].x).normalize();
}

function strip(width,offset,material){
 const v=[],idx=[];
 for(let i=0;i<N;i++){
  const j=(i+1)%N;
  const a=center[i].clone().addScaledVector(normal[i],-width/2);a.y+=offset;
  const b=center[i].clone().addScaledVector(normal[i], width/2);b.y+=offset;
  const c=center[j].clone().addScaledVector(normal[j], width/2);c.y+=offset;
  const d=center[j].clone().addScaledVector(normal[j],-width/2);d.y+=offset;
  const k=i*4;v.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z,d.x,d.y,d.z);
  idx.push(k,k+1,k+2,k,k+2,k+3);
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();
 const m=new THREE.Mesh(g,material);m.receiveShadow=true;scene.add(m);
}
strip(WIDTH,.03,matRoad);
strip(WIDTH+.48,.06,matEdge);

function addRail(side){
 for(let i=0;i<N;i+=8){
  const j=(i+8)%N;
  const p=center[i].clone().addScaledVector(normal[i],side*(WIDTH/2+.8));
  const q=center[j].clone().addScaledVector(normal[j],side*(WIDTH/2+.8));
  const mid=p.clone().lerp(q,.5);
  const len=p.distanceTo(q);
  const m=new THREE.Mesh(new THREE.BoxGeometry(.35,.8,len),matDark);
  m.position.set(mid.x,mid.y+.45,mid.z);
  m.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);
  m.castShadow=true;scene.add(m);
 }
}
addRail(1);addRail(-1);

// Start/finish arch.
function box(x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}
const startP=center[2],startN=normal[2],startT=tan[2];
box(startP.x,startP.y+4,startP.z,1,8,1,matDark);
box(startP.x,startP.y+8,startP.z,WIDTH+2,1,1,matDark);
const finishLine=new THREE.Mesh(new THREE.BoxGeometry(WIDTH,.035,2),new THREE.MeshStandardMaterial({color:0xffffff}));
finishLine.position.copy(startP);finishLine.position.y+=.06;finishLine.rotation.y=Math.atan2(startT.x,startT.z);scene.add(finishLine);

// ----- JUMPS / BANKS -----
const jumpIndices=[52,108,171,246,306];
for(const idx of jumpIndices){
 const p=center[idx],d=tan[idx],n=normal[idx];
 const ramp=new THREE.Mesh(new THREE.BoxGeometry(WIDTH*.72,1.0,16),matDark);
 ramp.position.copy(p);ramp.position.y+=1.0;
 ramp.rotation.y=Math.atan2(d.x,d.z);
 ramp.rotation.x=-.16;
 ramp.castShadow=ramp.receiveShadow=true;
 scene.add(ramp);
}

// Checkpoints as floating gates.
const checkpoints=[];
const checkpointCount=8;
for(let c=1;c<=checkpointCount;c++){
 const idx=Math.floor((c/checkpointCount)*N);
 const p=center[idx],d=tan[idx],n=normal[idx];
 const group=new THREE.Group();
 const poleMat=new THREE.MeshStandardMaterial({color:c===checkpointCount?0x42d36d:0xf1c84b});
 const left=box(-WIDTH/2-.5,0,0,.28,4,.28,poleMat);
 const rightPole=box(WIDTH/2+.5,0,0,.28,4,.28,poleMat);
 const top=box(0,2,0,WIDTH+1,.28,.28,poleMat);
 left.position.x=-WIDTH/2-.5;rightPole.position.x=WIDTH/2+.5;
 group.add(left,rightPole,top);
 group.position.set(p.x,p.y,p.z);group.rotation.y=Math.atan2(d.x,d.z);
 scene.add(group);
 checkpoints.push({index:idx,pos:p});
}

// ----- CAR -----
function makeCar(){
 const g=new THREE.Group();
 const red=new THREE.MeshStandardMaterial({color:0x1f75d6,metalness:.25,roughness:.3});
 const black=new THREE.MeshStandardMaterial({color:0x141619,roughness:.5});
 const glass=new THREE.MeshStandardMaterial({color:0x9dd5e5,roughness:.12,metalness:.15});
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.05,.55,4.25),red);
 body.position.y=.66;g.add(body);
 const nose=new THREE.Mesh(new THREE.BoxGeometry(1.8,.28,1.1),red);
 nose.position.set(0,.86,-1.55);g.add(nose);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.58,.66,1.75),glass);
 cabin.position.set(0,1.16,.25);g.add(cabin);
 const wheels=[];
 for(const x of [-1.04,1.04])for(const z of [-1.45,1.45]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.41,.41,.27,12),black);
  w.rotation.z=Math.PI/2;w.position.set(x,.40,z);g.add(w);wheels.push(w);
 }
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 scene.add(g);return{g,wheels};
}
const carVisual=makeCar();

// ----- SIMCADE PHYSICS -----
const car={
 p:new THREE.Vector3(),v:new THREE.Vector3(),yaw:0,yawRate:0,steer:0,
 grounded:true,spin:0,lastCP:0
};
const halfL=2.125,halfW=1.025;
const MASS=1100,ENGINE=9800,BRAKE=15000,DRAG=.018,ROLL=65;
const keys={};
addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.code==='KeyR')reset();
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

function fwd(){return new THREE.Vector3(Math.sin(car.yaw),0,Math.cos(car.yaw))}
function side(){return new THREE.Vector3(Math.cos(car.yaw),0,-Math.sin(car.yaw))}
function nearest(pos){
 let best=1e99,bi=0;
 for(let i=0;i<N;i++){const d=pos.distanceToSquared(center[i]);if(d<best){best=d;bi=i}}
 return bi;
}
function surface(pos){
 const i=nearest(pos);
 // Interpolate nearby centerline height.
 const p=center[i], n=normal[i];
 const lateral=pos.clone().sub(p).dot(n);
 return {height:p.y,lat:lateral,index:i};
}

function physics(dt){
 const throttle=(keys.KeyW||keys.ArrowUp)?1:0;
 const brake=(keys.KeyS||keys.ArrowDown)?1:0;
 const steerInput=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 const drift=!!keys.Space;
 const forward=fwd(),right=side();
 const long=car.v.dot(forward),lat=car.v.dot(right);
 const speed=Math.abs(long);

 const steerLimit=.58*(1-Math.min(speed/105,.55));
 car.steer+=(steerInput*steerLimit-car.steer)*Math.min(1,11*dt);

 // Longitudinal forces.
 let engine=throttle*ENGINE*(1-Math.min(Math.abs(long)/75,1));
 if(long<0)engine*=.25;
 let braking=brake?BRAKE*Math.sign(long||1):0;
 const drag=DRAG*long*Math.abs(long);
 const rolling=ROLL*Math.sign(long);
 car.v.addScaledVector(forward,(engine-braking-drag-rolling)/MASS*dt);

 // Tire force. This is what makes steering physically move the car rather than rotating it.
 const lateralGrip=drift?3.1:8.7;
 car.v.addScaledVector(right,(-lat*lateralGrip)*dt);

 // Yaw comes from the bicycle model.
 if(Math.abs(long)>.8){
  const target=(long/2.8)*Math.tan(car.steer);
  car.yawRate+=(target-car.yawRate)*(drift?5.0:9.0)*dt;
 }
 car.yaw+=car.yawRate*dt;

 // Small rolling loss.
 car.v.multiplyScalar(Math.pow(drift?.998:.995,dt*60));

 car.p.addScaledVector(car.v,dt);

 const s=surface(car.p);
 const targetY=s.height+.43;
 if(car.p.y<=targetY+0.12 && car.v.y<=2){
  car.p.y=targetY;car.v.y=0;car.grounded=true;
 }else{
  car.grounded=false;car.v.y-=23*dt;
 }
 
 // Keep the car on the track using an oriented rectangular footprint.
 const corners=[
  car.p.clone().addScaledVector(forward,halfL).addScaledVector(right,halfW),
  car.p.clone().addScaledVector(forward,halfL).addScaledVector(right,-halfW),
  car.p.clone().addScaledVector(forward,-halfL).addScaledVector(right,halfW),
  car.p.clone().addScaledVector(forward,-halfL).addScaledVector(right,-halfW)
 ];
 let worst=0,wn=null;
 for(const c of corners){
  const ss=surface(c);
  const out=Math.abs(ss.lat)-WIDTH/2;
  if(out>worst){worst=out;wn=ss}
 }
 if(worst>0 && wn){
  const n=normal[wn.index],sgn=wn.lat>0?1:-1;
  car.p.addScaledVector(n,-sgn*worst*.85);
  const vn=car.v.dot(n)*sgn;
  if(vn>0)car.v.addScaledVector(n,-sgn*vn*1.45);
  car.v.multiplyScalar(.75);
 }

 // Checkpoints and lap timing.
 const idx=nearest(car.p);
 const progress=(idx/N+1)%1;
 const next=(car.lastCP+1)%checkpointCount;
 const cpIdx=Math.floor(((next+1)/checkpointCount)*N)%N;
 if(car.p.distanceTo(checkpoints[next].pos)<9 && next!==car.lastCP){
  car.lastCP=next;
  if(next===checkpointCount-1)finishLap();
 }

 // Respawn if completely off the world.
 if(car.p.y<-30)reset();

 carVisual.g.position.copy(car.p);
 carVisual.g.rotation.y=car.yaw;
 car.spin+=car.v.length()*dt/.41;
 for(let i=0;i<4;i++)carVisual.wheels[i].rotation.x=car.spin*(i%2?1:-1);
 carVisual.wheels[0].rotation.y=car.steer;
 carVisual.wheels[1].rotation.y=car.steer;

 const kmh=Math.round(car.v.length()*3.6);
 document.getElementById('stats').textContent=kmh+' km/h · CHECKPOINT '+(car.lastCP+1)+'/'+checkpointCount;
}

let raceStart=performance.now(),best=null,running=true;
function finishLap(){
 const now=performance.now();
 const lap=(now-raceStart)/1000;
 if(best===null||lap<best)best=lap;
 raceStart=now;
 car.lastCP=0;
 flash(lap.toFixed(3)+'s');
}
function flash(t){
 const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;
 setTimeout(()=>m.style.opacity=0,900);
}
function reset(){
 const p=center[4],d=tan[4];
 car.p.set(p.x,p.y+.45,p.z);car.yaw=Math.atan2(d.x,d.z);
 car.v.set(0,0,0);car.yawRate=0;car.steer=0;car.grounded=true;car.lastCP=0;
 raceStart=performance.now();
 carVisual.g.position.copy(car.p);carVisual.g.rotation.y=car.yaw;
 flash('GO!');
}
function clock(){
 const s=(performance.now()-raceStart)/1000;
 const mm=Math.floor(s/60).toString().padStart(2,'0');
 const sec=(s%60).toFixed(3).padStart(6,'0');
 document.getElementById('time').textContent=mm+':'+sec;
 requestAnimationFrame(clock);
}

const timer=new THREE.Clock();
function loop(){
 const dt=Math.min(timer.getDelta(),.022);
 physics(dt);
 const forward=fwd();
 const speed=car.v.length();
 const distance=9+Math.min(speed*.055,4);
 const target=car.p.clone().addScaledVector(forward,-distance).add(new THREE.Vector3(0,4.1,0));
 camera.position.lerp(target,1-Math.pow(.00002,dt));
 camera.lookAt(car.p.clone().add(new THREE.Vector3(0,.8,0)).addScaledVector(forward,5));
 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
reset();clock();loop();
</script>
</body>
</html>
