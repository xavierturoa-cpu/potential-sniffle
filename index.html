<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Car Playground</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#9ab7c8;font-family:Arial}canvas{display:block}#hud{position:fixed;top:14px;left:14px;color:#eef2f4;background:#0007;padding:10px 13px;border-radius:8px;font:14px monospace;z-index:5;line-height:1.5}#speed{font-size:22px;font-weight:bold}#error{display:none;position:fixed;inset:0;background:#222;color:#fff;padding:40px;font:18px monospace;z-index:20}</style></head><body><div id="hud"><div id="speed">0 km/h</div><div id="state">ON GROUND</div>W/S throttle & brake<br>A/D steering · SPACE handbrake<br>R/T respawn</div><div id="error"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(function(){'use strict';if(!window.THREE){var e=document.getElementById('error');e.style.display='block';e.textContent='Could not load the 3D engine.';return}var T=THREE,S=new T.Scene();S.background=new T.Color(0x9ab7c8);S.fog=new T.Fog(0x9ab7c8,140,520);var C=new T.PerspectiveCamera(68,innerWidth/innerHeight,.05,1000),R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);S.add(new T.HemisphereLight(0xf0f4f5,0x64705e,1.45));var sun=new T.DirectionalLight(0xffffff,1.75);sun.position.set(-80,130,70);sun.castShadow=true;S.add(sun);function mat(c){return new T.MeshStandardMaterial({color:c,roughness:.9})}var grass=mat(0x718767),rampMat=mat(0x777b7d),obs=mat(0x85888a),blue=new T.MeshStandardMaterial({color:0x3978b8,metalness:.12,roughness:.42}),black=mat(0x202224),glass=new T.MeshStandardMaterial({color:0x8eabb5,roughness:.25,metalness:.05});var gnd=new T.Mesh(new T.PlaneGeometry(700,700),grass);gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;S.add(gnd);var objs=[];function box(x,z,w,h,d,rot){var m=new T.Mesh(new T.BoxGeometry(w,h,d),obs);m.position.set(x,h/2,z);m.rotation.y=rot||0;m.castShadow=m.receiveShadow=true;S.add(m);objs.push({type:'box',x:x,z:z,w:w,h:h,d:d,rot:rot||0})}function ramp(x,z,w,l,h,rot){var geo=new T.BufferGeometry(),v=[-w/2,0,-l/2,w/2,0,-l/2,-w/2,h,l/2,w/2,h,l/2,-w/2,0,l/2,w/2,0,l/2,-w/2,h,-l/2,w/2,h,-l/2],idx=[0,1,3,0,3,2,0,4,5,0,5,1,4,2,3,4,3,5,1,5,3,1,3,2,0,2,6,0,6,1];geo.setAttribute('position',new T.Float32BufferAttribute(v,3));geo.setIndex(idx);geo.computeVertexNormals();var m=new T.Mesh(geo,rampMat);m.position.set(x,0,z);m.rotation.y=rot||0;m.castShadow=m.receiveShadow=true;S.add(m);objs.push({type:'ramp',x:x,z:z,w:w,l:l,h:h,rot:rot||0})}ramp(0,-55,12,28,7,0);ramp(42,-12,14,34,10,.45);ramp(-45,18,13,30,9,-.6);ramp(12,52,16,38,14,1.57);ramp(-55,-62,18,42,18,.25);ramp(70,58,14,30,11,-.5);ramp(-5,105,20,46,20,1.57);box(25,25,10,5,10,.3);box(-28,-12,7,7,14,-.2);box(58,-48,18,3,5,.1);box(-72,45,8,9,8,.4);box(35,85,12,6,12,0);box(-65,-5,20,2,3,-.4);box(70,10,4,12,4,0);for(var i=-3;i<=3;i++)box(i*14,72,9,.8,1.4,0);var carG=new T.Group(),body=new T.Mesh(new T.BoxGeometry(2.15,.58,4.25),blue),hood=new T.Mesh(new T.BoxGeometry(1.9,.22,1.15),blue),cab=new T.Mesh(new T.BoxGeometry(1.62,.7,1.8),glass),wheels=[];body.position.y=.7;hood.position.set(0,1,-1.48);cab.position.set(0,1.18,.2);carG.add(body,hood,cab);for(var x of[-1.08,1.08])for(var z of[-1.45,1.45]){var w=new T.Mesh(new T.CylinderGeometry(.42,.42,.3,16),black);w.rotation.z=Math.PI/2;w.position.set(x,.42,z);carG.add(w);wheels.push(w)}carG.traverse(o=>{if(o.isMesh)o.castShadow=true});S.add(carG);var car={p:new T.Vector3(0,1,35),v:new T.Vector3(),yaw:Math.PI,yawRate:0,steer:0,grounded:true,spin:0,pitch:0},W=2.15,rad=.48,half=1.645,M=1100,ENG=12500,BRAKE=18000,MAX=62,keys={};addEventListener('keydown',function(e){keys[e.code]=1;if(e.code==='KeyR'||e.code==='KeyT')respawn();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});function F(){return new T.Vector3(Math.sin(car.yaw),0,Math.cos(car.yaw))}function Q(){return new T.Vector3(Math.cos(car.yaw),0,-Math.sin(car.yaw))}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rampAt(x,z){var best={h:0,n:null,on:false};for(var o of objs)if(o.type==='ramp'){var dx=x-o.x,dz=z-o.z,c=Math.cos(o.rot),s=Math.sin(o.rot),lx=dx*c-dz*s,lz=dx*s+dz*c;if(Math.abs(lx)<=o.w/2&&Math.abs(lz)<=o.l/2){var u=clamp((lz+o.l/2)/o.l,0,1),h=o.h*u,n=new T.Vector3(-o.h/o.l*s,1,-o.h/o.l*c).normalize();if(h>=best.h)best={h:h,n:n,on:true}}}return best}function surface(x,z){return rampAt(x,z)}function collideBoxes(){var f=F(),r=Q();for(var o of objs)if(o.type==='box'){var dx=car.p.x-o.x,dz=car.p.z-o.z,c=Math.cos(o.rot),s=Math.sin(o.rot),wx=dx*c-dz*s,wz=dx*s+dz*c,ls=wx*r.x+wz*r.z,lf=wx*f.x+wz*f.z,qx=clamp(ls,-o.w/2,o.w/2),qz=clamp(lf,-o.d/2,o.d/2),ex=ls-qx,ez=lf-qz,d=Math.hypot(ex,ez);if(d<rad){var nx=d>.001?ex/d:1,nz=d>.001?ez/d:0,n=new T.Vector3(c*nx-s*nz,0,s*nx+c*nz);car.p.addScaledVector(n,rad-d+.01);var vn=car.v.dot(n);if(vn<0)car.v.addScaledVector(n,-vn*1.5);car.v.multiplyScalar(.84);car.yawRate*=.6}}}function physics(dt){var th=keys.KeyW||keys.ArrowUp,br=keys.KeyS||keys.ArrowDown,si=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),hand=!!keys.Space,f=F(),r=Q(),lv=car.v.dot(f),lat=car.v.dot(r),speed=Math.abs(lv);car.steer+=(si*.62*(1-clamp(speed/80,0,.58))-car.steer)*Math.min(1,10*dt);var force=(th?ENG*(1-clamp(speed/MAX,0,.9)):0)-(br?BRAKE*Math.sign(lv||1):0)-75*lv-.55*lv*Math.abs(lv);car.v.addScaledVector(f,force/M*dt);car.v.addScaledVector(r,-lat*(hand?2.4:8.5)*dt);if(speed>1){var target=lv/2.75*Math.tan(car.steer);car.yawRate+=(target-car.yawRate)*(hand?4.5:8.5)*dt}car.yaw+=car.yawRate*dt;car.v.multiplyScalar(Math.pow(hand?.994:.997,dt*60));if(car.v.length()>MAX)car.v.setLength(MAX);car.p.addScaledVector(car.v,dt);var offs=[f.clone().multiplyScalar(half).add(r.clone().multiplyScalar(W/2-.12)),f.clone().multiplyScalar(half).add(r.clone().multiplyScalar(-W/2+.12)),f.clone().multiplyScalar(-half).add(r.clone().multiplyScalar(W/2-.12)),f.clone().multiplyScalar(-half).add(r.clone().multiplyScalar(-W/2+.12))],ct=0,sum=0,avgN=new T.Vector3();for(var o of offs){var p=car.p.clone().add(o),ra=surface(p.x,p.z);if(p.y-.42<=ra.h+.2){ct++;sum+=ra.h;avgN.add(ra.n||new T.Vector3(0,1,0))}}if(ct>=2&&car.v.y<=3){car.p.y=sum/ct+.43;car.grounded=true;var n=avgN.normalize(),vn=car.v.dot(n);if(vn<0)car.v.addScaledVector(n,-vn);else if(vn<3)car.v.addScaledVector(n,(3-vn)*.25);car.v.y=0;var ra=surface(car.p.x,car.p.z);if(ra.on)car.pitch=Math.atan2(ra.n.z,ra.n.y)}else{car.grounded=false;car.v.y-=25*dt;car.pitch*=.98}collideBoxes();if(car.p.y<-25)respawn();carG.position.copy(car.p);carG.rotation.set(car.pitch,car.yaw,0);car.spin+=car.v.length()*dt/.42;wheels.forEach((w,i)=>w.rotation.x=car.spin*(i%2?-1:1));wheels[0].rotation.y=car.steer;wheels[1].rotation.y=car.steer;document.getElementById('speed').textContent=Math.round(car.v.length()*3.6)+' km/h';document.getElementById('state').textContent=car.grounded?(hand?'DRIFTING':'ON GROUND'):'AIRBORNE'}function respawn(){car.p.set(0,1,35);car.v.set(0,0,0);car.yaw=Math.PI;car.yawRate=0;car.steer=0;car.grounded=true;car.pitch=0;carG.position.copy(car.p);carG.rotation.set(0,car.yaw,0)}respawn();var clock=new T.Clock();function loop(){var dt=Math.min(clock.getDelta(),.025);physics(dt);var f=F(),dist=9+Math.min(car.v.length()*.05,5),target=car.p.clone().addScaledVector(f,-dist).add(new T.Vector3(0,4.5,0));C.position.lerp(target,1-Math.pow(.00004,dt));C.lookAt(car.p.clone().add(new T.Vector3(0,.8,0)).addScaledVector(f,4));R.render(S,C);requestAnimationFrame(loop)}loop()})();</script></body></html>
